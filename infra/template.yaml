AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Autonomous AI Research Agent Root Template

Parameters:
  DeploymentMode:
    Type: String
    Default: full
    AllowedValues:
      - full
      - demo
    Description: full keeps the VPC, RDS, and Redis memory stack; demo deploys the low-cost serverless-only path.

Conditions:
  IsFullDeployment: !Equals [!Ref DeploymentMode, full]

Resources:
  # 1. Networking is the foundation — deploy first
  NetworkStack:
    Type: AWS::Serverless::Application
    Condition: IsFullDeployment
    Properties:
      Location: stacks/network.yaml

  # 2. DynamoDB tables needed by API and Agent
  DataStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/data.yaml

  # 3. Cognito auth foundation for Google sign-in and JWT validation
  AuthStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/auth.yaml
      Parameters:
        HostedUiDomainPrefix: !Sub 'meridian-agent-${AWS::Region}-${AWS::AccountId}'
        GoogleClientSecret: '{{resolve:ssm:/agent/auth/google_client_secret}}'

  # 4. Memory (RDS, Redis, S3) — depends on network for VPC + SG imports
  MemoryStack:
    Type: AWS::Serverless::Application
    Condition: IsFullDeployment
    DependsOn: NetworkStack
    Properties:
      Location: stacks/memory.yaml

  # 5. API Gateway WebSocket shell for live run traces
  ApiStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/api.yaml
      Parameters:
        RunAccessSecret: '{{resolve:ssm:/agent/run_access_secret}}'

  # 6. Agent compute — owns the HTTP API and depends on networking, memory, auth, and websocket outputs
  AgentStack:
    Type: AWS::Serverless::Application
    DependsOn:
      - AuthStack
      - ApiStack
    Properties:
      Location: stacks/agent.yaml
      Parameters:
        DeploymentMode: !Ref DeploymentMode
        CognitoUserPoolId: !GetAtt AuthStack.Outputs.UserPoolId
        CognitoUserPoolClientId: !GetAtt AuthStack.Outputs.UserPoolClientId
        WebSocketApiUrl: !GetAtt ApiStack.Outputs.WebSocketApiUrl
        TavilyApiKey: '{{resolve:ssm:TAVILY_API_KEY}}'
        OpenAiApiKey: '{{resolve:ssm:OPENAI_API_KEY}}'
        RunAccessSecret: '{{resolve:ssm:/agent/run_access_secret}}'
        DatabaseHost: !If [IsFullDeployment, !GetAtt MemoryStack.Outputs.DBEndpointAddress, '']
        DatabaseName: !If [IsFullDeployment, !GetAtt MemoryStack.Outputs.DBName, '']
        DatabasePassword: !If [IsFullDeployment, '{{resolve:ssm:/agent/db_password}}', '']
        LambdaSecurityGroupId: !If [IsFullDeployment, !GetAtt NetworkStack.Outputs.LambdaSecurityGroupId, '']
        PrivateSubnet1Id: !If [IsFullDeployment, !GetAtt NetworkStack.Outputs.PrivateSubnet1Id, '']
        PrivateSubnet2Id: !If [IsFullDeployment, !GetAtt NetworkStack.Outputs.PrivateSubnet2Id, '']

  # 7. Observability — standalone cost guardrail
  ObservabilityStack:
    Type: AWS::Serverless::Application
    Properties:
      Location: stacks/observability.yaml

Outputs:
  CognitoUserPoolId:
    Value: !GetAtt AuthStack.Outputs.UserPoolId
  CognitoUserPoolClientId:
    Value: !GetAtt AuthStack.Outputs.UserPoolClientId
  CognitoHostedUiBaseUrl:
    Value: !GetAtt AuthStack.Outputs.HostedUiBaseUrl
  CognitoJwtIssuer:
    Value: !GetAtt AuthStack.Outputs.JwtIssuer
  MeridianHttpApiUrl:
    Value: !GetAtt AgentStack.Outputs.HttpApiUrl
  MeridianWebSocketApiUrl:
    Value: !GetAtt ApiStack.Outputs.WebSocketApiUrl
